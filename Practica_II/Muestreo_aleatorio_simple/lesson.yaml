- Class: meta
  Course: Practica_II
  Lesson: Muestreo aleatorio simple
  Author: Emanuel Fernandez Salome
  Type: Standard
  Organization: UACJ
  Version: 2.4.5
  
- Class: text
  Output: "En esta leccion aprenderas que es el Muestreo Aleatorio Simple (MAS), sus requisitos matematicos de equiprobabilidad, su implementacion en R y la relacion entre estadisticos muestrales y parametros poblacionales."

- Class: text
  Output: "El muestreo Aleatorio Simple (MAS) es la tecnica probabilistica fundamental. Su propiedad central exige que cada elemento de la poblacion tenga la misma probabilidad de ser elegido y que cada combinacion de n elementos tenga identica probabilidad de constitucion. (2024, Enrique Rus Arias)."

- Class: mult_question
  Output: "En un Muestreo Aleatorio Simple (MAS) de tamano n extraido de una poblacion N, ¿que condicion debe cumplirse de manera estricta?"
  AnswerChoices: "Cada subconjunto posible de tamano n tiene exactamente la misma probabilidad de ser seleccionado;Las observaciones se seleccionan a intervalos fijos de tiempo;La poblacion debe dividirse previamente en estratos disjuntos;Se eligen primero los datos con valores extremos"
  CorrectAnswer: "Cada subconjunto posible de tamano n tiene exactamente la misma probabilidad de ser seleccionado"
  AnswerTests: omnitest(correctVal='Cada subconjunto posible de tamano n tiene exactamente la misma probabilidad de ser seleccionado')
  Hint: "El principio fundamental del MAS es la equiprobabilidad de todas las muestras posibles de tamano n."

- Class: text
  Output: "En tu entorno de trabajo se cargo previamente una poblacion simulada llamada 'poblacion_microservicios' con N = 500 microservicios y su medicion 'tiempo_ms'."

- Class: cmd_question
  Output: "Observa las primeras filas del data frame ejecutando head()."
  CorrectAnswer: "head(poblacion_microservicios)"
  AnswerTests: omnitest(correctExpr='head(poblacion_microservicios)')
  Hint: "Escribe head(poblacion_microservicios)"

- Class: text
  Output: "En situaciones reales, el parametro poblacional (Como la media verdadera µ) es desconocido. Aqui contamos con 'media_verdadera' para contrastarla directamente contra las estimaciones que obtenemos mediante la muestra."

- Class: cmd_question
  Output: "El parametro poblacional desconocido o real en la practica aqui lo conocemos. Consulta la media de la poblacion imprimiendo la variable 'media_verdadera'."
  CorrectAnswer: "media_verdadera"
  AnswerTests: expr_identical_to('media_verdadera')
  Hint: "Solo escribe media_verdadera en la consola."

- Class: text
  Output: "La simulacion de experimentos estocasticos requiere fijar la semilla del generador pseudoaleatorio con set.seed(). Esto asegura la reproducibilidad exacta de los indices muestrales seleccionados. (2022, Matthew. J. C. Crump)"

- Class: cmd_question
  Output: "Para obtener reproducibilidad en tu sesion, fija la semilla pseudoaleatoria en 42 ejecutando."
  CorrectAnswer: "set.seed(42)"
  AnswerTests: expr_identical_to('set.seed(42)')
  Hint: "Ejecuta set.seed()"

- Class: text
  Output: "La funcion sample(x, size, replace) permite seleccionar elementos al azar. Ajustar 'replace = FALSE' garantiza un muestreo sin reemplazo, requisito indispensable cuando la poblacion es finita y no queremos repetir observaciones."

- Class: cmd_question
  Output: "Extrae una muestra aleatoria simple de indices (tamano n = 30 sin reemplazo) sobre los 500 servicios y guardala en 'indices_muestra' usando sample( , , replace = FALSE)."
  CorrectAnswer: "indices_muestra <- sample(1:500, size = 30, replace = FALSE)"
  AnswerTests: expr_identical_to('indices_muestra <- sample(1:500, size = 30, replace = FALSE)')
  Hint: "Utiliza sample()"

- Class: cmd_question
  Output: "Ahora, filtra el data frame 'poblacion_microservicios' usando los 'indices_muestra' que acabas de generar y guarda el resultado en una nueva variable llamada 'muestra_mas'."
  CorrectAnswer: "muestra_mas <- poblacion_microservicios[indices_muestra, ]"
  AnswerTests: expr_identical_to('muestra_mas <- poblacion_microservicios[indices_muestra, ]')
  Hint: "Indexa las filas del data frame poblacion usando corchetes: dataset[filas, ]. Asigna el ersultado a muestra_mas."

- Class: text
  Output: "Un estimador puntual es una funcion de los datos muestrales (Como mean(x)) que sirve para aproximar un parametro poblacion desconocido."

- Class: cmd_question
  Output: "Calcula el estimador puntual (media muestral) del tiempo de respuesta con mean()."
  CorrectAnswer: "mean(muestra_mas$tiempo_ms)"
  AnswerTests: omnitest(correctExpr='mean(muestra_mas$tiempo_ms)')
  Hint: "Escribe $tiempo_ms al lado de la variable denro de la funcion mean()."

- Class: text
  Output: "La diferencia cuantitatica existente entre el valor del estimador muestral y el parametro real poblacional no implica una falla en la muestra; esta variacion natural se conoce como 'error de muestreo'."

- Class: mult_question
  Output: "Observa el valor obtenido en tu consola comparado con 'media_verdadera'. ¿A que se debe la discrepancia numerica entre ambos valores?"
  AnswerChoices: "Al error de muestreo natural inherente a estimar con un subconjunto n < N;A un error en el algoritmo de R Studio;A que el muestreo fue sesgado;A que n debio ser exactamente igual a N para poder calcular la media"
  CorrectAnswer: "Al error de muestreo natural inherente a estimar con un subconjunto n < N"
  AnswerTests: omnitest(correctVal='Al error de muestreo natural inherente a estimar con un subconjunto n < N')
  Hint: "La diferencia entre el estadistico y el parametro en un diseno no sesgado se conoce como variabilidad o error muestral."

- Class: text
  Output: "Excelente trabajo! Has implementado un Muestreo Aleatorio Simple en R, comparado el parametro con su estimador y comprendido el origen del error de muestreo."
