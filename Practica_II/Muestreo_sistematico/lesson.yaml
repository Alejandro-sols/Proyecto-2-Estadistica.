- Class: meta
  Course: Practica_II
  Lesson: Muestreo sistematico
  Author: Emanuel Fernandez Salome
  Type: Standard
  Organization: UACJ
  Version: 2.4.5

- Class: text
  Output: "Bienvenido a la leccion de Muestreo Sistematico. En este modulo aprenderas a determinar el intervalo de seleccion (k), el arranque aleatorio (A), la seleccion secuencial en R y los riesgos asociados a la periodicidad."

- Class: mult_question
  Output: "Deseamos seleccionar una muestra de n = 40 transacciones a partir de un log ordenado temporalmente con N = 800 registros. ¿Cual es el intervalo de elevacion o salto sistematico k = N / n?"
  AnswerChoices: "20;40;80;10"
  CorrectAnswer: "20"
  AnswerTests: omnitest(correctVal='20')
  Hint: "Divide 800 entre 40."

- Class: text
  Output: "Exacto, k = 20. El siguiente paso en el muestreo sistematico 1-en-k es elegir un punto de arranque aleatorio 'A' estrictamente entre 1 y k (equiprobabilidad de origen)."

- Class: cmd_question
  Output: "Fija la semilla en 10 con set.seed(10) para garantizar reproducibilidad."
  CorrectAnswer: "set.seed(10)"
  AnswerTests: expr_identical_to('set.seed(10)')
  Hint: "Escribe: set.seed(10)"

- Class: cmd_question
  Output: "Selecciona el arranque aleatorio 'arranque' eligiendo un unico numero entero entre 1 y 20 usando sample(1:20, 1)."
  CorrectAnswer: "arranque <- sample(1:20, 1)"
  AnswerTests: expr_identical_to('arranque <- sample(1:20, 1)')
  Hint: "Asigna: arranque <- sample(1:20, 1)"

- Class: cmd_question
  Output: "Verifica el valor de arranque imprimiendo la variable 'arranque'."
  CorrectAnswer: "arranque"
  AnswerTests: expr_identical_to('arranque')
  Hint: "Solo escribe arranque en la consola y presiona Enter."

- Class: cmd_question
  Output: "Los elementos seleccionados seran: A, A+k, A+2k, ... Construye el vector 'indices_sist' usando seq(from = arranque, to = 800, by = 20)."
  CorrectAnswer: "indices_sist <- seq(from = arranque, to = 800, by = 20)"
  AnswerTests: expr_identical_to('indices_sist <- seq(from = arranque, to = 800, by = 20)')
  Hint: "Usa seq(from = arranque, to = 800, by = 20)"

- Class: cmd_question
  Output: "Verifica que la muestra sistemica contenga exactamente n = 40 elementos ejecutando length(indices_sist)."
  CorrectAnswer: "length(indices_sist)"
  AnswerTests: omnitest(correctExpr='length(indices_sist)', correctVal=40)
  Hint: "Usa length(indices_sist)"

- Class: mult_question
  Output: "CRITICO: Supongamos que auditamos un servidor cuyo trafico experimenta un pico ciclico de sobrecarga cada 20 transacciones. Si nuestro k = 20 coincide con esa periodicidad natural, ¿que problema estadistico grave ocurre?"
  AnswerChoices: "Se introduce un sesgo sistematico severo en la muestra al capturar siempre el mismo punto del ciclo;El software lanzara un error de desbordamiento de memoria;La varianza de la muestra se vuelve cero obligatoriamente;El muestreo se convierte automaticamente en un muestreo estratificado"
  CorrectAnswer: "Se introduce un sesgo sistematico severo en la muestra al capturar siempre el mismo punto del ciclo"
  AnswerTests: omnitest(correctVal='Se introduce un sesgo sistematico severo en la muestra al capturar siempre el mismo punto del ciclo')
  Hint: "Si el intervalo k entra en fase o resonancia con un patron repetitivo oculto en el marco muestral, se destruye la representatividad."

- Class: text
  Output: "¡Excelente! Has dominado el calculo del intervalo k, la definicion del arranque aleatorio A, la generacion con seq() y la advertencia metodologica contra patrones ciclicos o periodicidad oculta."
